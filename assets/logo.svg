<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="lightningGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#070A10" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <circle cx="400" cy="340" r="180" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.15" filter="url(#glow)" />
  <circle cx="400" cy="340" r="140" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.12" />

  <g transform="translate(400, 330)">
    <path d="M 40 -120 
             A 140 140 0 1 0 100 80 
             L 50 40 
             A 90 90 0 1 1 20 -70 
             Z" 
          fill="url(#cyanPurpleGrad)" 
          filter="url(#glow)" 
          opacity="0.9" />

    <polygon points="-120,120 -20,10 -35,5 30,-75 140,-140 70,-30 85,-35 -10,80" 
             fill="url(#lightningGrad)" 
             filter="url(#subtleGlow)" />

    <polygon points="-100,105 -20,10 -30,10 25,-60 110,-115 70,-40 75,-40 0,60" 
             fill="#FFFFFF" 
             opacity="0.35" />
  </g>

  <text x="400" y="600" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-weight="900" 
        font-size="88" 
        letter-spacing="12" 
        fill="#FFFFFF">
    CUV
  </text>

  <text x="400" y="650" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-weight="700" 
        font-size="20" 
        letter-spacing="8" 
        fill="#38BDF8" 
        opacity="0.9">
    C-ULTRA-VELOCITY
  </text>
</svg>
