<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Araskova Solar Gradient: Deep Crimson-Orange to Radiant Gold -->
    <linearGradient id="cArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E64A19" />
      <stop offset="30%" stop-color="#FF5722" />
      <stop offset="65%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Velocity Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="45%" stop-color="#FF6D00" />
      <stop offset="80%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFF8E1" />
    </linearGradient>

    <!-- Specular Ridge Gradient -->
    <linearGradient id="specularRidge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#FFE082" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF6D00" stop-opacity="0" />
    </linearGradient>

    <!-- Transparent Multi-Mode Drop Shadow -->
    <filter id="vectorDropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.22" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent Background: No Enclosing Card -->

  <g filter="url(#vectorDropShadow)">
    
    <!-- The Architectural C Arc: Precision Circular Sweep with Forward Chisel Terminals -->
    <path d="M 405 152 
             A 172 172 0 1 0 405 360 
             L 348 312 
             A 110 110 0 1 1 348 200 
             Z" 
          fill="url(#cArcGrad)" />

    <!-- The Supersonic Velocity Strike (Mach Bolt) -->
    <!-- Slices diagonally from lower-left core and pierces out past the top-right terminal -->
    <polygon points="175,340 285,225 235,225 435,95 345,215 395,215" 
             fill="url(#boltGrad)" 
             filter="url(#boltGlow)" />

    <!-- Specular Chiseled Ridge along the Upper Edge of the Bolt -->
    <polygon points="235,225 435,95 410,120 315,225" 
             fill="url(#specularRidge)" />

    <!-- C++ Dual Satellite Precision Accents (+) -->
    <g fill="#FFA726" opacity="0.95">
      <!-- Upper Plus -->
      <polygon points="418,228 426,228 426,220 434,220 434,228 442,228 442,236 434,236 434,244 426,244 426,236 418,236" />

      <!-- Lower Plus -->
      <polygon points="418,284 426,284 426,276 434,276 434,284 442,284 442,292 434,292 434,300 426,300 426,292 418,292" />
    </g>

  </g>
</svg>
