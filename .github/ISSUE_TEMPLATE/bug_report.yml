name: 🐛 Bug Report
description: Create a report to help us fix an issue in CUV
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe what you were trying to do and what went wrong.
      placeholder: Tell us what you saw!
    validations:
      required: true
  - type: input
    id: command_run
    attributes:
      label: Command Executed
      description: The exact cuv command executed.
      placeholder: e.g. cuv build --release
    validations:
      required: true
  - type: textarea
    id: terminal_output
    attributes:
      label: Terminal Output
      description: Paste terminal output or error messages (with `cuv info` if possible).
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, compiler (`clang++ -v` or `g++ -v`), and CUV version (`cuv --version`).
      placeholder: e.g. macOS 14.4 (Apple Silicon), Apple clang 15.0.0, cuv 0.1.0
    validations:
      required: true
