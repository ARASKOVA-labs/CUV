name: 💡 Feature Request
description: Propose a new feature, optimization, or capability for CUV
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or developer friction?
      placeholder: Describe the challenge you are facing...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Ideal CLI Experience
      description: What should the command or feature look like?
      placeholder: e.g. cuv profile --flamegraph
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated?
