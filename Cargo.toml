[package]
name = "cuv"
version = "0.1.0"
edition = "2021"
description = "Extremely fast, zero-dependency package manager and build driver for C and C++"
authors = ["Araskova <engineering@araskova.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ARASKOVA-labs/CUV"
homepage = "https://github.com/ARASKOVA-labs/CUV"
documentation = "https://github.com/ARASKOVA-labs/CUV#readme"
keywords = ["cpp", "c", "build-system", "package-manager", "compiler"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
colored = "2.1"
indicatif = "0.18"
anyhow = "1.0"
which = "6.0"
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = "1.0"
tar = "0.4"
